<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <!--
    a standalone mirror of src/ui/ScoreCard.tsx at the 1080px export width,
    showing the worked example that ships in amp_card_indicators.xlsx
    ('Batting - Pace'): rating 74.72, coverage 72%, tier silver — so the whole
    plate is silver and everything on it is silver's ink.

    two zones with a rule between them: the hero, which is all anyone sees in a
    feed, and the ruled stat sheet, which is what they get if they stop.

    archivo is not a system font: opened as-is this falls back to helvetica and
    stops being an amp card. `node design/render.mjs` inlines the real archivo
    faces and writes amp-score-card.png — that render is the reference, not this.
  -->
  <defs>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DCE6EC"/>
      <stop offset="0.46" stop-color="#8E9BA4"/>
      <stop offset="1" stop-color="#4E5A62"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0" stop-color="#4E5A62" stop-opacity="0"/>
      <stop offset="1" stop-color="#4E5A62" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.28" cy="0.06" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="0" y="0" width="1080" height="1350" rx="59"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1080" height="1350" fill="url(#plate)"/>
    <rect width="1080" height="1350" fill="url(#scrim)"/>
    <ellipse cx="302" cy="54" rx="670" ry="405" fill="url(#spec)"/>

    <!-- mark: two carriageways meeting at a vanishing point -->
    <g transform="translate(86,86) scale(0.6910)" fill="#232C33">
      <path d="M 48.5 3 L 2.4 86 Q 1.2 89.6 4.6 87.8 L 47.8 71.5 Z"/>
      <path d="M 51.5 3 L 97.6 86 Q 98.8 89.6 95.4 87.8 L 52.2 71.5 Z"/>
    </g>
    <text x="181" y="145" font-size="67" font-weight="800" letter-spacing="-4.3" fill="#232C33">amp</text>
    <text x="994" y="131" font-size="28" font-weight="600" letter-spacing="5.4" fill="#232C33" fill-opacity="0.58" text-anchor="end">silver</text>

    <!-- the hero -->
    <text x="540" y="237" font-size="28" font-weight="600" letter-spacing="6.5" fill="#232C33" fill-opacity="0.58" text-anchor="middle">amp score</text>
    <text x="540" y="536" font-size="302" font-weight="800" letter-spacing="-18" fill="#232C33" text-anchor="middle">75</text>
    <text x="540" y="672" font-size="54" font-weight="800" fill="#232C33" text-anchor="middle">anshul yemul</text>
    <text x="540" y="726" font-size="35" font-weight="500" fill="#232C33" fill-opacity="0.58" text-anchor="middle">batting · pace</text>

    <!-- the stat sheet, ruled -->
    <g fill="#232C33" fill-opacity="0.16">
      <rect x="86.4" y="790.1" width="907.2" height="1.62"/>
      <rect x="86.4" y="964" width="907.2" height="1.62"/>
      <rect x="388.8" y="791.7" width="1.62" height="172.3"/>
      <rect x="691.2" y="791.7" width="1.62" height="172.3"/>
      <rect x="388.8" y="965.6" width="1.62" height="172.3"/>
      <rect x="691.2" y="965.6" width="1.62" height="172.3"/>
    </g>

    <g font-weight="700" font-size="60" letter-spacing="-2" fill="#232C33" text-anchor="middle">
      <text x="237.6" y="878">75</text>
      <text x="540"   y="878">72</text>
      <text x="842.4" y="878">78</text>
      <text x="237.6" y="1052">73</text>
      <text x="540"   y="1052">85</text>
      <text x="842.4" y="1052">64</text>
    </g>
    <g font-weight="500" font-size="28" fill="#232C33" fill-opacity="0.58" text-anchor="middle">
      <text x="237.6" y="926">balance</text>
      <text x="540"   y="926">power</text>
      <text x="842.4" y="926">timing</text>
      <text x="237.6" y="1100">control</text>
      <text x="540"   y="1100">footwork</text>
      <text x="842.4" y="1100">cricket iq</text>
    </g>

    <text x="540" y="1203" font-size="28" font-weight="500" letter-spacing="0.3" fill="#232C33" fill-opacity="0.58" text-anchor="middle">72% coverage · medium confidence</text>
    <text x="540" y="1256" font-size="28" font-weight="600" letter-spacing="1.5" fill="#232C33" fill-opacity="0.4" text-anchor="middle">tryamp.in</text>
  </g>
</svg>
